<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSL | Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
 
    <section class="auth-brand">

            <div class="brand-content">

                <div class="brand-logo">
                    Yves Saint Laurent
                    <span>STORE</span>
                </div>

                <div class="gold-line"></div>

                <h1>
                    Elegance Never<br>
                    Goes Out of Style.
                </h1>

                <p>
                    Selamat datang di Yves Saint Laurent Store.
                    Kelola produk, pesanan, pelanggan,
                    dan penjualan dengan mudah.
                </p>

            </div>

        </section>

        <section class="auth-form">

            <div class="login-box">

                <div class="mobile-logo">
                    <h1>Yves Saint Laurent</h1>
                    <span>STORE</span>
                </div>


                <div class="login-header">

                    <span class="welcome">
    <form id="loginForm">
    <div>

        <div class="login-card">

            <h1>Yves Saint Laurent</h1>
            <p>Login Dashboard</p>


            <form>

                <label>Email</label>
                <input type="Email" placeholder="Masukkan email" required>
            </form>

            <form>

                <label>Password</label>
                <input type="Password" placeholder="Masukkan Password" required>

                 <button type="submit">Login</button>
            </form>

            <div class="divider">
                <span>atau</span>
            </div>

            <form>

                <button type="button" class="google-btn">

                <i class="fra-brands fra-google">
                    Masuk Dengan Google
                </i>

                </button>
                
            </form>

            <p class="forgot">Lupa Password</p>

        <div class="remember">
            <input type="checkbox" id="remember">
            <label for="remember">Ingatkan Saya</label>
        </div>
           
        </div>

    </div>
    </form>

    <script src="login.js"></script>
</body>
</html>
